project:
  name: apa_05_func
  analysis_version: framework_2026-07-25_v5
  specification: framework.md
  description: Significant-APA-QTL-first mechanism, consequence, mediation, and disease integration configuration.
  analysis_chain: SNP_to_APA_to_molecular_consequence_to_disease_relevance
  baseline_optional_extension_policy:
    eqtl_coloc: required_primary_same_cohort_functional_support
    external_qtl_coloc: secondary_cross_population_validation_not_primary_gate
    protein_sample_metadata: optional_absent_use_directly_matchable_protein_columns_only
    pfc_rbp_expression: optional_level_2_RBP_expression_available_own_cohort_TPM
    enrichment_gene_sets: optional_absent_use_R_package_gene_sets_when_available
    tested_apa_gene_universe: derive_from_pipeline_inputs_not_external_file

conventions:
  phenotype_id_format: "transcript_id|gene_name|3UTR_coordinates|strand"
  beta_definition: "ALT allele effect on PDUI"
  beta_positive_meaning: "ALT increases PDUI; 3UTR lengthening"
  beta_negative_meaning: "ALT decreases PDUI; 3UTR shortening"
  allele_harmonization_required: true
  direction_blocked_when:
    - beta_alt_PDUI_is_NaN
    - allele_harmonized_is_false
  strand_aware_sequence: true
  negative_strand_requires_reverse_complement: true
  transcript_oriented_windows: true
  cleavage_site_origin: 0
  dur_definition: from_phenotype_id_coordinate
  pas_anchor_primary: phenotype_id_3UTR_coordinates
  pas_anchor_fallback: phenotype_boundary_approximation

inputs:
  prenatal_finemapped_apaqtl:
    description: Prenatal variant-phenotype fine-mapping table from SuSiE with PIP; signed effect is joined from prenatal_significant_apaqtl.slope when needed.
    path: "/gpfs/hpc/home/chenchao/liyc/project/work/apa/05_func/raw/prenatal.SuSiE_summary.parquet"
    required_columns:
      - variant_id
      - phenotype_id
      - pip
      - af
      - cs_id
    signed_effect_source_input: prenatal_significant_apaqtl
  prenatal_significant_apaqtl:
    description: Prenatal significant APA-QTL pairs with signed tensorQTL slope and allele fields.
    path: "/gpfs/hpc/home/chenchao/liyc/project/work/apa/05_func/raw/prenatal.signif_pairs.txt.gz"
    required_columns:
      - chr
      - pos
      - ref
      - alt
      - phenotype_id
      - variant_id
      - af
      - ma_samples
      - ma_count
      - pval_nominal
      - slope
      - slope_se
  postnatal_finemapped_apaqtl:
    description: Postnatal variant-phenotype fine-mapping table from SuSiE with PIP; signed effect is joined from postnatal_significant_apaqtl.slope when needed.
    path: "/gpfs/hpc/home/chenchao/liyc/project/work/apa/05_func/raw/postnatal.SuSiE_summary.parquet"
    required_columns:
      - variant_id
      - phenotype_id
      - pip
      - af
      - cs_id
    signed_effect_source_input: postnatal_significant_apaqtl
  postnatal_significant_apaqtl:
    description: Postnatal significant APA-QTL pairs with signed tensorQTL slope and allele fields.
    path: "/gpfs/hpc/home/chenchao/liyc/project/work/apa/05_func/raw/postnatal.signif_pairs.txt.gz"
    required_columns:
      - chr
      - pos
      - ref
      - alt
      - phenotype_id
      - variant_id
      - af
      - ma_samples
      - ma_count
      - pval_nominal
      - slope
      - slope_se
  interaction_apaqtl:
    description: GxStage significant interaction pairs from 03_interaction with b_g, b_gi, and BH FDR; cross-stage direction/class is derived downstream from b_g and b_gi.
    path: "/gpfs/hpc/home/chenchao/liyc/project/work/apa/05_func/raw/interaction.signif_pairs.txt.gz"
    required_columns:
      - variant_id
      - phenotype_id
      - b_g
      - b_gi
      - pval_adj_bh
  apa_phenotype_annotation:
    description: APA phenotype annotation from 02_pattern; strand and event coordinates are parsed from phenotype_id when not present as separate columns.
    path: "/gpfs/hpc/home/chenchao/liyc/project/work/apa/03_interaction/results/00_preprocess/proximal.apa.info"
    required_columns:
      - phenotype_id
      - Gene
      - fit_value
      - Predicted_Proximal_APA
      - Loci
    optional_columns:
      - proximal_pas_coordinate
      - distal_pas_coordinate
      - proximal_cleavage_site
      - distal_cleavage_site
  gwas_coloc_results:
    description: GWAS colocalization results from 04_coloc.
    path: "/gpfs/hpc/home/chenchao/liyc/project/work/apa/04_coloc/results/runs/20261028_full19_repaired/all_colocalization_results.csv"
    required_for_baseline: true
  eqtl_coloc_results:
    description: Stage-matched same-cohort APA/eQTL sharing used as primary functional support, distinct from mediation and independent replication.
    path: "/gpfs/hpc/home/chenchao/liyc/project/work/apa/05_func/work/coloc/internal_eqtl.tsv"
    required_for_baseline: true
    absent_status: stop_current_v5_pipeline
    absent_behavior: fill_eQTL_columns_as_NA_not_available_and_exclude_from_baseline_support
  tested_apa_gene_universe:
    description: Pipeline-derived gene universe from all valid APA phenotype_id values available in baseline inputs.
    derive_in_script: "07_enrichment.R"
    output_path: "/gpfs/hpc/home/chenchao/liyc/project/work/apa/05_func/work/enrichment/tested_genes.tsv"
    required_for_baseline: false
    external_input_required: false
  protein_abundance:
