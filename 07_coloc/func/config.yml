candidate_sets:
  primary_association_universe:
    source_inputs:
      - prenatal_significant_apaqtl
      - postnatal_significant_apaqtl
    selection: all_rows
    definition: permutation_fdr_significant_phenotype_plus_phenotype_specific_nominal_pair_threshold
  evidence_thresholds:
    pip_exploratory:
      operator: strict_greater_than
      value: 0.5
    pip_high_confidence:
      operator: greater_than_or_equal
      value: 0.8
    pp4_exploratory:
      operator: strict_greater_than
      value: 0.5
    pp4_primary:
      operator: greater_than_or_equal
      value: 0.7
    pp4_high_confidence:
      operator: greater_than_or_equal
      value: 0.8
    credible_set_level: 0.95
  evidence_layers_do_not_filter_universe:
    - fine_mapping
    - interaction_qtl
    - sequence_mechanism
    - mediation
    - coloc
    - sldsc

background_sets:
  tested_universe:
    definition: All genes entering APA-QTL or interaction-QTL testing with valid phenotype_id.
    source_input: tested_apa_gene_universe
    source_type: pipeline_derived
    derived_output: "/gpfs/hpc/home/chenchao/liyc/project/work/apa/05_func/ref/tested_apa_gene_universe.tsv"
    use_for:
      - line_a_descriptive_enrichment
  non_flip_interaction:
    definition: Formal interaction groups whose 03_interaction posterior class is not Opposing; Flip is a binary display alias for Opposing.
    source_input: gxstage_classes
    include_cross_stage_classes:
      - Amplified
      - Attenuated
      - Uncertain
    use_for:
      - line_b_gxstage_contrast_enrichment
  whole_genome_protein_coding:
    definition: Optional sensitivity-analysis background only.
    path: ""
    primary_background: false

parameters:
  framework_contract:
    qtl_universe: all_significant_pairs
    association_unit: stage_x_phenotype_x_variant
    signal_unit: stage_x_phenotype_x_independent_signal
    consequence_unit: stage_x_phenotype_x_molecular_outcome
    disease_unit: trait_x_stage_x_phenotype_x_locus
    do_not_collapse_disease_traits: true
    composite_total_score: disabled
  signal_assignment:
    preferred: conditional_or_susie_credible_set
    fallback: ancestry_matched_ld_clumping
    ld_reference: /gpfs/hpc/home/chenchao/liyc/project/work/apa/03_interaction/results/00_preprocess/genotype
    ld_window_kb: 1000
    ld_r2: 0.1
    ld_measure: unphased_dosage_r2
    sample_reference: stage_specific_study_genotypes
    unassigned_policy: stop_if_reference_variant_or_genotype_missing
  mediation:
    mediator: normalized_stage_specific_PDUI
    primary_outcome_scope: same_gene
    outcome_types:
      - rna_expression
      - protein_abundance
    primary_test: nonparametric_bootstrap_indirect_effect
    bootstrap_n: 5000
    bootstrap_seed: 20260716
    bootstrap_pvalue_estimator: two_sided_finite_resample_plus_one
    confidence_level: 0.95
    secondary_test: sobel
    sensitivity: genotype_and_covariate_adjusted_residual_association
    multiple_testing: BH_within_stage_and_outcome_type
    fdr: 0.05
    minimum_complete_case_n: 50
    multiple_signal_model: jointly_adjust_other_representative_signals
    causal_interpretation: cross_sectional_model_consistent_not_temporal_proof
  disease_integration:
    preserve_all_coloc_rows: true
    require_same_gene_molecular_support: true
    nearby_gene_support_is_separate: true
    coloc_prior_sensitivity_required_for_high_confidence: true
    shared_credible_set_membership_required_for_disease_star: true
  internal_eqtl_integration:
    role: same_cohort_molecular_sharing
    same_gene_mapping: exact_gencode_v40_ensembl_gene_id
    nearby_gene_policy: context_only
    orthogonal_evidence: false
    primary_functional_support: exact_same_gene_PP4_gte_0.75
    tier_eligible: exact_same_gene_primary_support_only
    standalone_consequence_eligible: false
    independent_replication: false
    recommended_robustness:
      - coloc_prior_sensitivity
  internal_eqtl_coloc:
    min_shared_snps: 100
    pp4_threshold: 0.75
    p1: 0.0001
    p2: 0.0001
    p12: 0.00001
  cell_deconvolution:
    primary_method: BisqueRNA_reference_based_stage_specific
    sensitivity_method: CIBERSORTx_not_run_unavailable_account_and_environment
    sensitivity_status: unavailable_not_blocking
    prenatal_classes:
      - Excitatory neuron
      - Inhibitory neuron
      - Astrocyte
      - OPC
      - Microglia/Immune
      - Vascular/Mural
      - Glial progenitor
    postnatal_classes:
      - Excitatory neuron
      - Inhibitory neuron
      - Astrocyte
      - Oligodendrocyte
      - OPC
      - Microglia/Immune
      - Vascular/Mural
    prenatal_stage_rule: gestational_age_label_regex
    postnatal_disease_filter: normal
    postnatal_unknown_age_policy: exclude
    marker_genes_per_class: 50
    marker_min_cpm: 5
    marker_min_detection: 0.5
    marker_min_log2_fc: 0.5
    synthetic_mixtures_per_donor: 3
    benchmark_seed: 20260713
    qtl_covariates: stage_specific_ILR_coordinates
    proportion_pseudocount: 0.000001
  external_qtl_coloc:
    pp4_threshold: 0.75  # Historical Module 11 boolean; framework v2 uses the tiered fields below.
    pp4_exploratory: 0.5
    pp4_high_confidence: 0.8
    min_shared_snps: 100
    p1: 0.0001
    p2: 0.0001
    p12: 0.00001
    apa_event_matching: exact_GRCh38_event_coordinate
    same_gene_other_event_role: context_only
    exact_event_role: secondary_cross_population_replication
    pqtl_role: secondary_cross_population_same_gene_protein_support
    population_relation: independent_external_population_not_matched_to_local_cohort
  windows:
    pas_core_hexamer_window_nt:
      start: -50
      end: -1
    use_window_nt:
      start: -100
      end: -40
    dse_window_nt:
      start: 10
      end: 50
    aparent_window_nt: 205
    aparent_site_inclusion_half_window_nt: 102
  pas_hexamers:
    - AATAAA
    - ATTAAA
    - AGTAAA
    - TATAAA
    - GATAAA
    - CATAAA
    - AATACA
    - AATATA
    - AATAGA
    - AATGAA
    - AAGAAA
    - AACAAA
    - ACTAAA
    - TTTAAA
    - AAAAAA
  pas_ref_alt_classes:
    - Gain
    - Loss
    - Modulation
    - Not_supported
  auxiliary_motif_classes:
    - ARE
    - GRE
    - URE
  mirna_site_types:
    - 8mer
    - 7mer-m8
    - 7mer-a1
  density:
    unit_nt: 100
    evidence_threshold: matched_background_nonzero_Q75
    raw_count_is_mechanistic_evidence: false
  rbp_evidence_levels:
    level_1: CISBP_RNA_motif
    level_2: motif_plus_PFC_or_stage_matched_RBP_expression
    level_3: motif_plus_POSTAR3_CLIP_peak
  rbp_expression:
    source: own_cohort_all.912.tpm_RNA_seq_912_PFC_samples
    stage_matched: true
    min_mean_tpm: 1.0
    unsupported_behavior: RBP_motif_evidence_excluded_from_v2_rbp_variant_delta_support_and_case_figures
  rna_structure:
    method: RNAfold
    metric: delta_G
    local_delta_mfe_threshold_kcal_mol: 2.0
    standalone_strong_mechanism_evidence: false
  conservation:
    metrics:
      - variant_position
      - pas_window_mean
      - pas_window_max
      - dur_mean
      - dur_max
      - dur_top_10_percent
    standalone_mechanism_claim: false
  interaction:
    cross_stage_class_source: 03_interaction
    do_not_recalculate_cross_stage_class: true
    analysis_unit: interaction_group_id
    representative_pair_is_independent_signal: false
    classes:
      - Opposing
      - Amplified
      - Attenuated
      - Uncertain
    binary_comparison:
      Flip: Opposing
      non_Flip:
        - Amplified
        - Attenuated
        - Uncertain
  module_e_mechanism_comparison:
    groups:
      - Flip
      - non_Flip
    variables:
      - PAS_disrupted
      - RBP_high
      - miRNA_high
      - conservation
    tests:
      - Fisher
      - chi_square
      - logistic_regression_if_needed
    logistic_regression_covariates:
      - MAF
      - DUR_length
  enrichment:
    line_a:
      contrast: significant_apaqtl_genes_vs_tested_universe
      background: tested_universe
    fine_mapped_sensitivity:
      contrast: high_confidence_finemapped_genes_vs_significant_apaqtl_genes
    line_b:
      contrast: Flip_genes_vs_non_Flip_interaction_genes
      background: non_flip_interaction
  protein_evidence_labels:
    - consistent
    - opposite
    - no_change
    - not_detected
  prioritization:
    method: ordered_evidence_tiers
    total_score: disabled
    mechanism_star_requirements:
      - significant_apaqtl
      - named_variant_pip_at_least_0.8
      - direct_or_supported_local_snp_to_apa_mechanism
      - resolved_allele_strand_pas_and_pdui_direction
    disease_star_additional_requirements:
      - pp4_at_least_0.8
      - acceptable_prior_sensitivity
      - proposed_variant_in_shared_credible_or_posterior_set
      - mediation_supported
  missing_external_resource_label: pending_resource

aparent_direction_consistency:
  delta_proximal_definition: "Delta log(Odds) of proximal PAS; 0 if variant outside +/-102 nt window"
  delta_distal_definition: "Delta log(Odds) of distal PAS; 0 if variant outside +/-102 nt window"
  predicted_PDUI_delta_formula: "APARENT_delta_distal - APARENT_delta_proximal"
  correlation:
    method: Spearman
    x: aparent_predicted_PDUI_delta
    y: beta_alt_PDUI
    outputs:
      - rho
      - p_value
      - n
  skip_when:
    - aparent_scored_site_is_none
    - apa_direction_is_direction_blocked
  skipped_label: APARENT_not_applicable

quality_control:
  required_before_modules:
    - phenotype_id_parseable
    - 3UTR_coordinate_parseable
    - strand_parseable
    - reference_sequence_extractable_for_sequence_analysis
    - variant_allele_matches_reference_genome_for_allele_analysis
    - beta_alt_PDUI_available_or_direction_blocked_labeled
    - DUR_coordinate_resolved
  excluded_output_fields:
    - candidate_id
    - variant_id
    - phenotype_id
    - step
    - reason
  do_not_silently_drop_candidates: true

scripts:
  "run.sh":
    path: "run.sh"
    entrypoint: true
  "01_prepare.py":
    path: "scripts/01_prepare.py"
    produces:
      - "01_significant_qtl_universe.tsv.gz"
      - "05_excluded_or_blocked.tsv.gz"
  "02_mechanism.py":
    path: "scripts/02_mechanism.py"
    produces:
      - "02_signal_mechanisms.tsv.gz"
  "03_deconvolution.R":
    path: "scripts/03_deconvolution.R"
  "04_consequence.py":
    path: "scripts/04_consequence.py"
    produces:
      - "03_event_consequences.tsv.gz"
  "05_coloc.R":
    path: "scripts/05_coloc.R"
  "06_disease.py":
    path: "scripts/06_disease.py"
    produces:
      - "07_internal_eqtl_integration_contract.tsv.gz"
      - "04_disease_chains.tsv.gz"
      - "05_evidence_tiers.tsv.gz"
  "07_enrichment.R":
    path: "scripts/07_enrichment.R"
    produces:
      - "06_functional_enrichment.tsv.gz"
  "08_plot_cases.py":
    path: "scripts/08_plot_cases.py"
  "09_plot.R":
    path: "scripts/09_plot.R"
  "10_finalize.py":
    path: "scripts/10_finalize.py"

outputs:
  results_directory:
    path: "results"
  files:
    "01_significant_qtl_universe.tsv.gz":
      script: "01_prepare.py"
      unit: stage_x_phenotype_x_variant
    "02_signal_mechanisms.tsv.gz":
      script: "02_mechanism.py"
      unit: stage_x_phenotype_x_independent_signal
    "03_event_consequences.tsv.gz":
      script: "04_consequence.py"
      unit: stage_x_phenotype_x_molecular_outcome
    "04_disease_chains.tsv.gz":
      script: "06_disease.py"
      unit: trait_x_stage_x_phenotype_x_locus
    "05_evidence_tiers.tsv.gz":
      script: "06_disease.py"
      description: Ordered evidence tiers with explicit mechanism, consequence, and disease labels.
    "05_excluded_or_blocked.tsv.gz":
      script: "01_prepare.py"
      description: Complete parse, coordinate, reference-allele, direction, and signal-assignment accounting.
    "06_functional_enrichment.tsv.gz":
      script: "07_enrichment.R"
      unit: tested_contrast_x_GO_term
    "07_internal_eqtl_integration_contract.tsv.gz":
      script: "06_disease.py"
      unit: candidate_x_eGene

downstream:
  primary_consumer: cross_module_integration
  primary_tables:
    - "01_significant_qtl_universe.tsv.gz"
    - "02_signal_mechanisms.tsv.gz"
    - "03_event_consequences.tsv.gz"
    - "04_disease_chains.tsv.gz"
    - "05_evidence_tiers.tsv.gz"
